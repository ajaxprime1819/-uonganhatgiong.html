<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cày Thuê - Hạt Giống</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Top Navbar */
    .top-navbar {
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .user-balance-badge {
      background-color: #eef2ff;
      color: #4f46e5;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      border: 1px solid #c7d2fe;
    }

    /* Cards */
    .form-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      border: 1px solid #eef2f7;
    }

    .step-badge {
      width: 28px;
      height: 28px;
      background-color: #0d6efd;
      color: white;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      margin-right: 8px;
    }

    .step-title {
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }

    /* Nút Tạo Đơn Hàng */
    .btn-submit-order {
      background-color: #93a5e6;
      color: #ffffff;
      border: none;
      padding: 10px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-submit-order:hover {
      background-color: #8194dc;
      color: #ffffff;
    }

    .modal-content {
      border-radius: 16px;
      border: none;
      overflow: hidden;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg top-navbar mb-4 py-2">
  <div class="container" style="max-width: 950px;">
    <a class="navbar-brand fw-bold text-primary" href="#">
      <i class="fa-solid fa-gamepad me-1"></i> SHOP DỊCH VỤ
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center gap-2 mt-2 mt-lg-0">
        <li class="nav-item">
          <button class="btn btn-danger btn-sm rounded-pill px-3 fw-bold" data-bs-toggle="modal" data-bs-target="#rechargeModal">
            <i class="fa-solid fa-wallet me-1"></i> Nạp Tiền
          </button>
        </li>
        <li class="nav-item">
          <span class="user-balance-badge">
            <i class="fa-solid fa-coins text-warning me-1"></i> Số dư: 0 đ
          </span>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold" data-bs-toggle="modal" data-bs-target="#authModal">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng Nhập / Đăng Ký
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- FORM CHÍNH -->
<div class="container py-2" style="max-width: 850px;">
  <form id="orderForm">
    <div class="text-center mb-3">
      <h3 class="fw-bold text-uppercase" style="letter-spacing: 1px;">CÀY THUÊ - HẠT GIỐNG</h3>
    </div>

    <div class="alert alert-danger text-center p-2 mb-4 fw-bold text-uppercase" style="border-radius: 30px; font-size: 14px;">
      <marquee behavior="scroll" direction="left" scrollamount="6">
        ĐIỀN ĐÚNG THÔNG TIN CẦN THIẾT HOẶC LIÊN HỆ ADMIN || CUỐI TRANG || ĐỂ HOÀN THÀNH ĐƠN
      </marquee>
    </div>

    <!-- BƯỚC 1: CHỌN GÓI -->
    <div class="form-card p-4 mb-4">
      <div class="d-flex align-items-center mb-3">
        <span class="step-badge">1</span>
        <span class="step-title">Chọn Gói Cần Thuê</span>
      </div>
      <select class="form-select" id="packageSelect" required>
        <option value="" selected disabled>Tìm và chọn dịch vụ cần thuê...</option>
        <option value="1">HẠT GIỐNG - 200 HẠT - 35,000 đ</option>
        <option value="2">HẠT GIỐNG - 500 HẠT - 16,000 đ</option>
        <option value="3">HẠT GIỐNG - 2,000 HẠT - 35,000 đ</option>
        <option value="4">BAMBOO (TRE) - 30,000 HẠT - 40,000 đ</option>
      </select>
    </div>

    <!-- BƯỚC 2: THÔNG TIN TÀI KHOẢN (Đã xóa Cookie/2FA) -->
    <div class="form-card p-4 mb-4">
      <div class="d-flex align-items-center mb-3">
        <span class="step-badge">2</span>
        <span class="step-title">Thông Tin Tài Khoản</span>
      </div>

      <div class="row g-3">
        <!-- Tài khoản -->
        <div class="col-md-6">
          <label class="form-label fw-semibold text-secondary" style="font-size: 14px;">Tài Khoản</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
            <input type="text" class="form-control" placeholder="Nhập tài khoản cần cày" required>
          </div>
        </div>

        <!-- Mật khẩu -->
        <div class="col-md-6">
          <label class="form-label fw-semibold text-secondary" style="font-size: 14px;">Mật Khẩu</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" placeholder="Nhập mật khẩu của tài khoản đó" required>
          </div>
        </div>
      </div>
    </div>

    <!-- BƯỚC 3: GHI CHÚ & XÁC NHẬN -->
    <div class="form-card p-4 mb-4">
      <div class="d-flex align-items-center mb-3">
        <span class="step-badge">3</span>
        <span class="step-title">Ghi Chú & Xác Nhận</span>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary" style="font-size: 14px;">Ghi Chú</label>
        <textarea class="form-control" rows="3" maxlength="500" placeholder="Nhập ghi chú cho admin nếu có..."></textarea>
        <div class="text-end text-muted small mt-1">0 / 500</div>
      </div>

      <div class="text-center mt-4">
        <p class="text-muted small mb-2 fw-semibold">Vui lòng chọn gói cần thuê</p>
        <button type="submit" class="btn-submit-order shadow-sm">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>Tạo Đơn Hàng</span>
        </button>
      </div>
    </div>
  </form>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Chuyển hướng sau khi tạo đơn
  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert("Tạo đơn hàng thành công!");
    window.location.href = "https://google.com"; // Link chuyển trang
  });
</script>

</body>
</html>
