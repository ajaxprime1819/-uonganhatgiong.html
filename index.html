<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cày Thuê - Hạt Giống</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Styles cho Navigation Bar */
    .top-navbar {
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .user-balance-badge {
      background-color: #eef2ff;
      color: #4f46e5;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      border: 1px solid #c7d2fe;
    }

    /* Card Form Styles */
    .form-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      border: 1px solid #eef2f7;
    }

    .step-badge {
      width: 28px;
      height: 28px;
      background-color: #0d6efd;
      color: white;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      margin-right: 8px;
    }

    .step-title {
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }

    .btn-submit-order {
      background-color: #93a5e6;
      color: #ffffff;
      border: none;
      padding: 10px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-submit-order:hover {
      background-color: #8194dc;
      color: #ffffff;
    }

    /* Custom Style cho Modal Đăng nhập/Đăng ký */
    .modal-content {
      border-radius: 16px;
      border: none;
      overflow: hidden;
    }
    .nav-tabs .nav-link {
      font-weight: 600;
      color: #6c757d;
      border: none;
      border-bottom: 2px solid transparent;
    }
    .nav-tabs .nav-link.active {
      color: #0d6efd;
      border-bottom: 2px solid #0d6efd;
      background: transparent;
    }
  </style>
</head>
<body>

<!-- ================= PHẦN HEADER ================= -->
<nav class="navbar navbar-expand-lg top-navbar mb-4 py-2">
  <div class="container" style="max-width: 950px;">
    <!-- Logo -->
    <a class="navbar-brand fw-bold text-primary" href="#">
      <i class="fa-solid fa-gamepad me-1"></i> SHOP DỊCH VỤ
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center gap-2 mt-2 mt-lg-0">
        
        <!-- Nút Nạp Tiền -->
        <li class="nav-item">
          <a class="btn btn-danger btn-sm rounded-pill px-3 fw-bold" href="#">
            <i class="fa-solid fa-wallet me-1"></i> Nạp Tiền
          </a>
        </li>

        <!-- TH1: Trường hợp đã Đăng Nhập -->
        <li class="nav-item">
          <span class="user-balance-badge">
            <i class="fa-solid fa-coins text-warning me-1"></i> Số dư: 0 đ
          </span>
        </li>

        <!-- TH2: Nút bấm Mở Form Đăng Nhập / Đăng Ký (Modal) -->
        <li class="nav-item">
          <button class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold" data-bs-toggle="modal" data-bs-target="#authModal">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng Nhập / Đăng Ký
          </button>
        </li>

      </ul>
    </div>
  </div>
</nav>

<!-- ================= PHẦN FORM TẠO ĐƠN HÀNG ================= -->
<div class="container py-2" style="max-width: 850px;">
  <form id="orderForm">
    <div class="text-center mb-3">
      <h3 class="fw-bold text-uppercase" style="letter-spacing: 1px;">CÀY THUÊ - HẠT GIỐNG</h3>
    </div>

    <div class="alert alert-danger text-center p-2 mb-4 fw-bold text-uppercase" style="border-radius: 30px; font-size: 14px;">
      <marquee behavior="scroll" direction="left" scrollamount="6">
        ĐIỀN ĐÚNG THÔNG TIN CẦN THIẾT HOẶC LIÊN HỆ ADMIN || CUỐI TRANG || ĐỂ HOÀN THÀNH ĐƠN
      </marquee>
    </div>

    <!-- Bước 1 -->
    <div class="form-card p-4 mb-4">
      <div class="d-flex align-items-center mb-3">
        <span class="step-badge">1</span>
        <span class="step-title">Chọn Gói Cần Thuê</span>
      </div>
      <select class="form-select" id="packageSelect" required>
        <option value="" selected disabled>Tìm và chọn dịch vụ cần thuê...</option>
        <option value="1">HẠT GIỐNG - 200 HẠT - 35,000 đ</option>
        <option value="2">HẠT GIỐNG - 500 HẠT - 16,000 đ</option>
      </select>
    </div>

    <!-- Bước 2 -->
    <div class="form-card p-4 mb-4">
      <div class="d-flex align-items-center mb-3">
        <span class="step-badge">2</span>
        <span class="step-title">Thông Tin Tài Khoản</span>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold text-secondary" style="font-size: 14px;">Tài Khoản</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
            <input type="text" class="form-control" placeholder="Nhập tài khoản cần cày" required>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold text-secondary" style="font-size: 14px;">Mật Khẩu</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" placeholder="Nhập mật khẩu" required>
          </div>
        </div>
      </div>
    </div>

    <!-- Bước 3 -->
    <div class="form-card p-4 mb-4">
      <div class="d-flex align-items-center mb-3">
        <span class="step-badge">3</span>
        <span class="step-title">Ghi Chú & Xác Nhận</span>
      </div>
      <div class="text-center mt-4">
        <p class="sub-text mb-2 fw-semibold text-muted">Vui lòng chọn gói cần thuê</p>
        <button type="submit" class="btn-submit-order shadow-sm">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>Tạo Đơn Hàng</span>
        </button>
      </div>
    </div>
  </form>
</div>

<!-- ================= MODAL CỬA SỔ ĐĂNG NHẬP / ĐĂNG KÝ ================= -->
<div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg">
      
      <!-- Tab chuyển Đăng Nhập / Đăng Ký -->
      <div class="modal-header border-0 pb-0">
        <ul class="nav nav-tabs w-full border-0" id="authTab" role="tablist">
          <li class="nav-item flex-fill text-center" role="presentation">
            <button class="nav-link active w-100 fs-5" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-tab-pane" type="button" role="tab">Đăng Nhập</button>
          </li>
          <li class="nav-item flex-fill text-center" role="presentation">
            <button class="nav-link w-100 fs-5" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-tab-pane" type="button" role="tab">Tạo Tài Khoản</button>
          </li>
        </ul>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <div class="tab-content" id="authTabContent">
          
          <!-- TAB 1: FORM ĐĂNG NHẬP -->
          <div class="tab-pane fade show active" id="login-tab-pane" role="tabpanel">
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label font-weight-semibold">Tên tài khoản hoặc Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                  <input type="text" class="form-control" placeholder="Nhập tên đăng nhập" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label font-weight-semibold">Mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                  <input type="password" class="form-control" placeholder="Nhập mật khẩu" required>
                </div>
              </div>
              <div class="d-flex justify-content-between align-items-center mb-3 fs-14">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="rememberMe">
                  <label class="form-check-label text-muted" for="rememberMe">Ghi nhớ đăng nhập</label>
                </div>
                <a href="#" class="text-primary text-decoration-none small">Quên mật khẩu?</a>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 font-weight-bold">Đăng Nhập Ngay</button>
            </form>
          </div>

          <!-- TAB 2: FORM ĐĂNG KÝ (TẠO TÀI KHOẢN) -->
          <div class="tab-pane fade" id="register-tab-pane" role="tabpanel">
            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label font-weight-semibold">Tên tài khoản</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-user-plus"></i></span>
                  <input type="text" class="form-control" placeholder="Tên đăng nhập mới" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label font-weight-semibold">Địa chỉ Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                  <input type="email" class="form-control" placeholder="VD: example@gmail.com" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label font-weight-semibold">Mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                  <input type="password" class="form-control" placeholder="Tạo mật khẩu" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label font-weight-semibold">Xác nhận mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                  <input type="password" class="form-control" placeholder="Nhập lại mật khẩu" required>
                </div>
              </div>
              <button type="submit" class="btn btn-success w-100 py-2 rounded-3 font-weight-bold">Tạo Tài Khoản Mới</button>
            </form>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Xử lý tạo đơn xong tự chuyển sang web khác
  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert("Tạo đơn hàng thành công! Đang chuyển hướng...");
    window.location.href = "https://google.com"; // Link chuyển hướng
  });
</script>

</body>
</html>
