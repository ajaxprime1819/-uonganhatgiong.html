<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cày Thuê - Hạt Giống</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .form-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      border: 1px solid #eef2f7;
    }

    /* Badge số thứ tự 1, 2, 3 */
    .step-badge {
      width: 28px;
      height: 28px;
      background-color: #0d6efd;
      color: white;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      margin-right: 8px;
    }

    .step-title {
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }

    /* Style cho các ô input */
    .custom-input-group .input-group-text {
      background-color: #f8f9fa;
      border-color: #dee2e6;
      color: #6c757d;
    }

    .form-control, .form-select {
      border-color: #dee2e6;
      padding: 0.6rem 0.75rem;
      font-size: 14px;
    }

    .form-control:focus, .form-select:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
    }

    /* Subtext chú thích */
    .sub-text {
      font-size: 12px;
      color: #6c757d;
    }

    /* Nút Tạo Đơn Hàng */
    .btn-submit-order {
      background-color: #93a5e6;
      color: #ffffff;
      border: none;
      padding: 10px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-submit-order:hover {
      background-color: #8194dc;
      color: #ffffff;
    }

    /* Bàn tay nhấp chuột & vô hiệu hóa nút khi bấm */
    .btn-submit-order:disabled {
      background-color: #c0caf0;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="container py-4" style="max-width: 850px;">

  <!-- Form Đặt Hàng -->
  <form id="orderForm">

    <!-- Tiêu đề trang -->
    <div class="text-center mb-3">
      <h3 class="fw-bold text-uppercase" style="letter-spacing: 1px;">CÀY THUÊ - HẠT GIỐNG</h3>
    </div>

    <!-- Thanh thông báo chạy (Marquee) -->
    <div class="alert alert-danger text-center p-2 mb-4 fw-bold text-uppercase" style="border-radius: 30px; font-size: 14px;">
      <marquee behavior="scroll" direction="left" scrollamount="6">
        ĐIỀN ĐÚNG THÔNG TIN CẦN THIẾT HOẶC LIÊN HỆ ADMIN || CUỐI TRANG || ĐỂ HOÀN THÀNH ĐƠN
      </marquee>
    </div>

    <!-- BƯỚC 1: Chọn Gói Cần Thuê -->
    <div class="form-card p-4 mb-4">
      <div class="d-flex align-items-center mb-3">
        <span class="step-badge">1</span>
        <span class="step-title">Chọn Gói Cần Thuê</span>
      </div>
      
      <select class="form-select" id="packageSelect" required>
        <option value="" selected disabled>Tìm và chọn dịch vụ cần thuê...</option>
        <option value="1">HẠT GIỐNG - 200 HẠT - 35,000 đ</option>
        <option value="2">HẠT GIỐNG - 500 HẠT - 16,000 đ</option>
        <option value="3">HẠT GIỐNG - 2,000 HẠT - 35,000 đ</option>
        <option value="4">BAMBOO (TRE) - 30,000 HẠT - 40,000 đ</option>
        <option value="5">BAMBOO (TRE) - 100,000 HẠT - 80,000 đ</option>
        <option value="6">SUN BLOOM ~ MOON BLOOM - 5,000 đ</option>
        <option value="7">star fruit - 15,000 đ</option>
        <option value="8">HYDRA BLOOM - 8 HẠT - 16,000 đ</option>
      </select>
    </div>

    <!-- BƯỚC 2: Thông Tin Tài Khoản -->
    <div class="form-card p-4 mb-4">
      <div class="d-flex align-items-center mb-3">
        <span class="step-badge">2</span>
        <span class="step-title">Thông Tin Tài Khoản</span>
      </div>

      <div class="row g-3 mb-3">
        <!-- Tài khoản -->
        <div class="col-md-6">
          <label class="form-label fw-semibold text-secondary" style="font-size: 14px;">Tài Khoản</label>
          <div class="input-group custom-input-group">
            <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
            <input type="text" class="form-control" id="username" placeholder="Nhập tài khoản cần cày" required>
          </div>
        </div>

        <!-- Mật khẩu -->
        <div class="col-md-6">
          <label class="form-label fw-semibold text-secondary" style="font-size: 14px;">Mật Khẩu</label>
          <div class="input-group custom-input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu của tài khoản đó" required>
          </div>
        </div>
      </div>

      <!-- Cookie / 2FA -->
      <div class="mb-1">
        <label class="form-label fw-semibold text-secondary" style="font-size: 14px;">Cookie / 2FA</label>
        <input type="text" class="form-control" placeholder="Có thể nhập chuỗi 2FA, link game pass hoặc cookie liên quan">
      </div>
      <div class="sub-text">
        <i class="fa-regular fa-circle-question me-1"></i>Dữ liệu này không bắt buộc, có thể bỏ trống
      </div>
    </div>

    <!-- BƯỚC 3: Ghi Chú & Xác Nhận -->
    <div class="form-card p-4 mb-4">
      <div class="d-flex align-items-center mb-3">
        <span class="step-badge">3</span>
        <span class="step-title">Ghi Chú & Xác Nhận</span>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary" style="font-size: 14px;">Ghi Chú</label>
        <textarea class="form-control" rows="3" maxlength="500" placeholder="Nhập ghi chú cho admin nếu có..."></textarea>
        <div class="text-end sub-text mt-1">0 / 500</div>
      </div>

      <!-- Khu vực nút bấm thanh toán -->
      <div class="text-center mt-4">
        <p class="sub-text mb-2 fw-semibold" id="noticeMsg">Vui lòng chọn gói cần thuê</p>
        <button type="submit" id="btnSubmit" class="btn-submit-order shadow-sm">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="btnText">Tạo Đơn Hàng</span>
        </button>
      </div>
    </div>

  </form>

</div>

<!-- JavaScript Xử Lý Chuyển Trang -->
<script>
  // CẤU HÌNH TRANG WEB ĐÍCH BẠN MUỐN CHUYỂN TỚI TẠI ĐÂY
  const REDIRECT_URL = "https://google.com"; // Thay bằng URL trang lịch sử đơn hàng/trang mới của bạn

  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Ngăn trang web reload lại ngay lập tức

    const btn = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const noticeMsg = document.getElementById('noticeMsg');

    // 1. Đổi trạng thái nút bấm (để tránh người dùng nhấp nhiều lần)
    btn.disabled = true;
    btnText.innerText = "Đang tạo đơn hàng...";
    noticeMsg.innerText = "Đang xử lý, vui lòng chờ trong giây lát...";
    noticeMsg.style.color = "#0d6efd";

    // 2. Chờ 1 giây giả lập xử lý xong và nhảy sang web khác
    setTimeout(function() {
      // Đổi sang đường dẫn trang web mới
      window.location.href = REDIRECT_URL;
    }, 1200); // 1200ms = 1.2 giây
  });
</script>

</body>
</html>
